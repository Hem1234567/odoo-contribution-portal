name: One-time contribution session — 31 Oct 2026

on:
  schedule:
    - cron: '30 9 * * *'   # 15:00 Asia/Kolkata
    - cron: '25 11 * * *'  # 16:55 Asia/Kolkata
  workflow_dispatch:
    inputs:
      phase:
        description: 'Recovery phase for the 31 Oct 2026 session'
        required: true
        type: choice
        options: [prepare, finalize]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  session:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Select phase and enforce one-day date
        id: phase
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_PHASE: ${{ inputs.phase }}
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Kolkata date +%F)"
          if [[ "$TODAY" != "2026-10-31" ]]; then
            echo "This workflow is configured for 31 October 2026 only."
            echo "run_phase=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_phase=$INPUT_PHASE" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_SCHEDULE" == "30 9 * * *" ]]; then
            echo "run_phase=prepare" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_SCHEDULE" == "25 11 * * *" ]]; then
            echo "run_phase=finalize" >> "$GITHUB_OUTPUT"
          else
            echo "run_phase=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token
        if: steps.phase.outputs.run_phase != 'skip'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CONTRIBUTION_APP_ID }}
          private-key: ${{ secrets.CONTRIBUTION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read

      - name: Checkout destination repository
        if: steps.phase.outputs.run_phase != 'skip'
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Prepare three contributor branches
        if: steps.phase.outputs.run_phase == 'prepare'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          for branch in auto/frontend auto/backend auto/cobol-database; do
            if ! gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
              gh api --method POST "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$MAIN_SHA"
            fi
          done
          echo "Three isolated branches are ready."

      - name: Build integration candidate and test before touching main
        if: steps.phase.outputs.run_phase == 'finalize'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Odoo Contribution Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          # Require the two frontend packages to be present, plus the backend and COBOL/database parts.
          git ls-tree -r --name-only origin/auto/frontend | grep -q '^frontend/src/pages/'
          git ls-tree -r --name-only origin/auto/frontend | grep -q '^frontend/src/context/'
          git ls-tree -r --name-only origin/auto/backend | grep -q '^backend/'
          git ls-tree -r --name-only origin/auto/cobol-database | grep -q '^cobol-engine/'

          git checkout -B integration/session-2026-10-31 origin/main
          git merge --no-edit --no-ff origin/auto/frontend
          git merge --no-edit --no-ff origin/auto/backend
          git merge --no-edit --no-ff origin/auto/cobol-database

          sudo apt-get update
          sudo apt-get install -y gnucobol
          node --version
          npm run install:all
          npm run build
          npm test

          git push origin HEAD:refs/heads/integration/session-2026-10-31

          PR_NUMBER="$(gh pr list --repo "$REPO" --state open --base main --head integration/session-2026-10-31 --json number --jq '.[0].number // empty')"
          if [[ -z "$PR_NUMBER" ]]; then
            gh pr create --repo "$REPO" \
              --base main \
              --head integration/session-2026-10-31 \
              --title "Integrate all contributor packages — 31 Oct 2026" \
              --body "Automated integration candidate. All three contributor branches were combined and the full project build and tests passed before this PR was opened. The existing main README is preserved."
          fi

      - name: Wait for integration PR checks and merge
        if: steps.phase.outputs.run_phase == 'finalize'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list --repo "$REPO" --state open --base main --head integration/session-2026-10-31 --json number --jq '.[0].number // empty')"
          if [[ -z "$PR_NUMBER" ]]; then
            echo "::error::Integration PR was not created. main remains unchanged."
            exit 1
          fi
          gh pr checks "$PR_NUMBER" --repo "$REPO" --watch --fail-fast
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch
